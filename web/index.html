<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The path provided below has to start and end with a slash "/" in order for
    it to work correctly when the app is hosted from a sub-path.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shelfwise — a responsive library management web app for cataloguing books, registering members and tracking loans.">
  <meta name="theme-color" content="#1F5A4A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shelfwise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Shelfwise · Library Management</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F6F4EE;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(circle at 20% 20%, #EAF0EA 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, #F3E9D6 0%, transparent 55%),
        #F6F4EE;
      z-index: 9999;
    }

    #splash .mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2B6B58, #14453A);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(20, 69, 58, 0.28);
    }

    #splash .mark svg {
      width: 32px;
      height: 32px;
    }

    #splash h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.3px;
      color: #1A2622;
      font-weight: 700;
    }

    #splash p {
      margin: 0;
      font-size: 12.5px;
      color: #6B7269;
      letter-spacing: 0.2px;
    }

    #splash .bar {
      width: 132px;
      height: 3px;
      border-radius: 99px;
      background: #E3DED2;
      overflow: hidden;
    }

    #splash .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: #1F5A4A;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v18H6.5A2.5 2.5 0 0 1 4 18.5v-13Z" fill="#F3E7CB" opacity=".9"/>
        <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v18h4.5a2.5 2.5 0 0 0 2.5-2.5v-13Z" fill="#F3E7CB"/>
        <path d="M12 3v18" stroke="#1F5A4A" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Shelfwise</h1>
    <p>Opening the library workspace…</p>
    <div class="bar"><span></span></div>
  </div>

  <script>
    // Hide the splash as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash && splash.parentNode) {
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 220ms ease';
        setTimeout(function () { splash.remove(); }, 240);
      }
    });
  </script>

  <!--
    flutter_bootstrap.js is generated by `flutter build web` and accepts a
    custom configuration. See:
    https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
